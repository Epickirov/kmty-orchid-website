<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星空艺术兰 · 展台大屏</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>
/* Sized in vw/vh throughout: the display is fed by phone casting, which caps
   at 1080p, but the same page has to survive a 4K stick or a laptop at an odd
   resolution. Nothing here is in pixels except hairlines. */
:root{
  --bg:#141018; --ink:#F3EEE4; --muted:#a79db2; --acc:#E7B7CF;
  --serif:Georgia,'Songti SC','Noto Serif SC',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{
  background-image:
    radial-gradient(ellipse at 78% -10%,rgba(231,183,207,.16),transparent 52%),
    radial-gradient(ellipse at 8% 108%,rgba(46,78,158,.20),transparent 55%);
  display:grid;grid-template-columns:1fr 27vw;
}
/* ---------- stage (the bloom) ---------- */
#stage{position:relative;display:flex;align-items:center;justify-content:center}
#mixcv{
  width:min(88vh,68vw);height:min(88vh,68vw);display:block;
  filter:drop-shadow(0 3vh 6vh rgba(0,0,0,.55));
}
#no{
  position:absolute;left:50%;transform:translateX(-50%);bottom:3.2vh;
  font-family:var(--serif);font-size:1.7vh;letter-spacing:.42em;color:rgba(243,238,228,.42);
}
/* ---------- panel ---------- */
#panel{
  border-left:1px solid rgba(243,238,228,.10);
  background:linear-gradient(180deg,rgba(243,238,228,.045),rgba(243,238,228,.015));
  padding:4.4vh 2.6vw;display:flex;flex-direction:column;gap:2.2vh;
  backdrop-filter:blur(6px);
}
.mark{font-family:var(--serif);font-size:2.5vh;letter-spacing:.06em}
.mark b{color:var(--acc);font-weight:600}
.tag{font-size:1.35vh;letter-spacing:.34em;color:var(--muted);margin-top:.7vh}
.rule{height:1px;background:rgba(243,238,228,.12)}
.lbl{font-size:1.3vh;letter-spacing:.3em;color:var(--muted)}
#cols{display:flex;flex-direction:column;gap:1.9vh;flex:1;min-height:0;justify-content:center}
.row{display:flex;align-items:center;gap:1.4vw}
.dot{
  width:5.6vh;height:5.6vh;border-radius:50%;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.30), 0 .8vh 2vh rgba(0,0,0,.45);
}
.meta{flex:1;min-width:0}
.nm{font-size:2.5vh;font-weight:500;line-height:1.15}
.bar{height:.55vh;border-radius:99px;background:rgba(243,238,228,.13);margin-top:.9vh;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.pct{font-family:var(--serif);font-size:2.3vh;color:var(--muted);min-width:3.4vw;text-align:right}
/* ---------- scan-to-play ---------- */
#scan{display:flex;align-items:center;gap:1.2vw}
#qr{width:11vh;height:11vh;border-radius:1.1vh;background:#fff;padding:.8vh;flex:0 0 auto}
#qr canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#scan .t{font-size:1.9vh;line-height:1.45}
#scan .s{font-size:1.35vh;color:var(--muted);margin-top:.5vh;word-break:break-all}
/* Only ever visible when sync is actually broken — a dead demo should say so
   rather than look like a working one that nobody is touching. */
#down{
  position:fixed;left:1.4vw;bottom:1.4vh;font-size:1.3vh;letter-spacing:.16em;
  color:#e79b9b;background:rgba(20,15,26,.9);border:1px solid rgba(231,155,155,.45);
  border-radius:99px;padding:.7vh 1.4vw;display:none;
}
body.offline #down{display:block}
#rotate{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(20,15,26,.95);font-size:3.4vh;letter-spacing:.14em;color:var(--acc);
  text-align:center;padding:6vw;z-index:20;
}
/* Only on a genuinely phone-shaped portrait viewport — a portrait *monitor*
   is a legitimate setup and shouldn't be nagged. */
@media (max-aspect-ratio:1/1) and (max-width:560px){ #rotate{display:flex} }
@media (max-aspect-ratio:1/1){    /* portrait fallback if someone rotates the caster */
  body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #panel{border-left:0;border-top:1px solid rgba(243,238,228,.10);flex-direction:row;align-items:center;gap:3vw}
  #cols{flex-direction:row}
  .nm{font-size:1.9vh}
}
</style>
</head>
<body>
  <div id="stage">
    <canvas id="mixcv" width="560" height="560"></canvas>
    <div id="no">№ ——</div>
  </div>

  <aside id="panel">
    <div>
      <div class="mark">KMTY <b>星空艺术兰</b></div>
      <div class="tag">CONSTELLATION</div>
    </div>
    <div class="rule"></div>
    <div class="lbl">本 株 配 色</div>
    <div id="cols"></div>
    <div class="rule"></div>
    <div id="scan">
      <div id="qr"></div>
      <div>
        <div class="t">扫码调色</div>
        <div class="s" id="curl">—</div>
      </div>
    </div>
  </aside>

  <div id="down">大屏未连接 · 请检查网络</div>
  <!-- Mirroring a portrait phone to a landscape TV pillarboxes the picture and
       wastes most of a 98" panel. Say so on screen rather than letting it look
       like a design choice. -->
  <div id="rotate">请将手机横屏后投屏</div>

<script src="engine.js"></script>
<script src="qr.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('mixcv');
  var eng = KMTYEngine(cv, {
    onNumber: function (t) { document.getElementById('no').textContent = t; }
  });

  /* ---------- colour panel ---------- */
  var colsEl = document.getElementById('cols');
  function paintPanel() {
    var st = eng.state(), C = eng.colors();
    var total = st.sel.reduce(function (t, k) { return t + (st.weights[k] || 1); }, 0) || 1;
    colsEl.innerHTML = '';
    st.sel.forEach(function (k) {
      var c = C[k]; if (!c) return;
      var pct = Math.round((st.weights[k] || 0) / total * 100);
      var row = document.createElement('div'); row.className = 'row';
      row.innerHTML =
        '<span class="dot" style="background:' + c.hex + '"></span>' +
        '<span class="meta"><span class="nm"></span>' +
        '<span class="bar"><i style="width:' + pct + '%;background:' + c.hex + '"></i></span></span>' +
        '<span class="pct">' + pct + '%</span>';
      row.querySelector('.nm').textContent = c.zh || c.en;   // textContent: names are data
      colsEl.append(row);
    });
  }

  function apply(st, animate) {
    if (!st || !st.sel || !st.sel.length) return;
    eng.apply(st, animate);
    paintPanel();
  }

  /* Opening design: a URL hash wins (lets you pin a specific mix for a photo),
     otherwise the engine's own default. */
  eng.onReady(function () {
    var h = eng.parseHash(location.hash);
    apply(h || eng.state(), false);
  });

  /* ---------- QR of this display's own control URL ---------- */
  var curl = location.origin + '/c';
  document.getElementById('curl').textContent = curl.replace(/^https?:\/\//, '');
  try {
    var m = QR.encode(curl, { ecc: 'M' }), box = 4, pad = 2;
    var q = document.createElement('canvas');
    q.width = q.height = (m.size + pad * 2) * box;
    var g = q.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, q.width, q.height);
    g.fillStyle = '#141018';
    for (var r = 0; r < m.size; r++) for (var c2 = 0; c2 < m.size; c2++)
      if (m.rows[r][c2]) g.fillRect((c2 + pad) * box, (r + pad) * box, box, box);
    document.getElementById('qr').append(q);
  } catch (e) { document.getElementById('qr').style.display = 'none'; }

  /* ---------- keep the casting device awake ----------
     The display is fed by a phone screen-cast, and a phone that sleeps takes
     the 98" screen with it. Wake Lock is dropped whenever the tab is
     backgrounded, so re-acquire on every return to visibility. */
  var lock = null;
  function hold() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      l.addEventListener('release', function () { lock = null; });
    }).catch(function () {});
  }
  hold();
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !lock) hold(); });

  /* ---------- live sync ---------- */
  var lastTouch = Date.now();
  function connect() {
    if (!window.EventSource) return;
    var es = new EventSource('/events');
    es.onopen = function () { document.body.classList.remove('offline'); };
    es.onmessage = function (ev) {
      try {
        var d = JSON.parse(ev.data);
        if (d && d.state) { lastTouch = Date.now(); apply(d.state, true); }
      } catch (e) {}
    };
    // EventSource retries on its own; the class just surfaces the gap on screen.
    es.onerror = function () { document.body.classList.add('offline'); };
  }
  connect();

  /* Attract mode: an untouched stand should still move. After 45s of quiet the
     display re-swirls itself every 20s so it never reads as a frozen poster. */
  setInterval(function () {
    if (Date.now() - lastTouch < 45000) return;
    if (document.hidden) return;
    eng.reswirl();
    paintPanel();
    // Publish it too, so a phone picked up mid-show adopts what the screen is
    // actually showing rather than resetting the stand to the default mix.
    fetch('/state', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(eng.state())
    }).catch(function () {});
  }, 20000);
})();
</script>
</body>
</html>
